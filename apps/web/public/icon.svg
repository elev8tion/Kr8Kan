<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Voltage Garden: near-black console void (kr8 bg dark #0a0a0a),
       voltage-lime mark bridging the accent tokens
       (dark accent #9dd522 to light accent #5f8a16). -->
  <defs>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dd522"/>
      <stop offset="1" stop-color="#5f8a16"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#9dd522" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#0a0a0a"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#9dd522" stroke-opacity="0.35" stroke-width="1.5"/>
  <text
    x="32"
    y="33"
    fill="url(#volt)"
    filter="url(#glow)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="30"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >K8</text>
</svg>
